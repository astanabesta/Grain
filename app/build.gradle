plugins { id 'com.android.application' }
android {
    namespace 'dev.grain.photo'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.grain.photo'
        minSdk 29
        targetSdk 36
        versionCode 82
        versionName '0.9.40'
    }
    buildFeatures {
        buildConfig true // RawDevelopment writes BuildConfig.VERSION_NAME into the EXIF Software tag
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        // Personal signing key for device-test builds. CI points GRAIN_KEYSTORE at a key it keeps
        // between runs (or at the GRAIN_DEBUG_KEYSTORE_BASE64 secret), so updates install over the
        // previous version. Never use this for a store release.
        personal {
            def ks = System.getenv('GRAIN_KEYSTORE')
            storeFile file(ks ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        // Published builds are release builds: not debuggable, so ART compiles the RAW developer
        // properly instead of running it in debug mode.
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.personal
        }
    }
    lint { abortOnError true; checkReleaseBuilds false }
    testOptions {
        unitTests {
            includeAndroidResources = true
            // Camera-back screenshots (Robolectric): only when GRAIN_SCREENS=1 (dev branches in CI).
            all { test ->
                if (System.getenv('GRAIN_SCREENS') == '1') test.maxHeapSize = System.getenv('GRAIN_SCREENS_HEAP') ?: '2g'
                else {
                    test.exclude '**/CameraBackScreensTest*'
                    test.maxHeapSize = '448m' // small-CI boxes: default fork + main JVM OOMs
                }
            }
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
