<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#050507" />
<title>Recipe Cam — v3</title>
<style>
/*__CSS__*/
</style>
</head>
<body>

<div class="app" id="app">
  <canvas id="viewport"></canvas>
  <canvas id="viewport2d"></canvas>
  <video id="video" playsinline muted autoplay hidden></video>

  <!-- ── HUD ─────────────────────────────────────────── -->
  <div class="hud" id="hud">
    <svg class="grid" id="grid" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="33.333" y1="0" x2="33.333" y2="100" />
      <line x1="66.666" y1="0" x2="66.666" y2="100" />
      <line x1="0" y1="33.333" x2="100" y2="33.333" />
      <line x1="0" y1="66.666" x2="100" y2="66.666" />
    </svg>
    <canvas class="hist" id="hist" width="132" height="44" hidden></canvas>
    <div class="level" id="level" hidden><span class="level-line" id="levelLine"></span><span class="level-tick"></span></div>
    <div class="frame-guide" id="frameGuide">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    </div>
    <div class="reticle" id="reticle"><i></i><i></i><i></i><i></i></div>
  </div>

  <!-- ── top bar ─────────────────────────────────────── -->
  <div class="topbar">
    <button class="lg round sm" id="btnGallery" title="Last shot">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10.5" r="1.7"/>
        <path d="M3.5 16.5l4-3.2 3.2 2.4 3.6-3.6 5 4.4"/>
      </svg>
    </button>

    <div class="mode-pill lg" id="modePill">
      <span class="dot" id="modeDot"></span>
      <span id="modeText">SAMPLE</span>
      <span class="sep"></span>
      <span id="frameText">3:2</span>
    </div>

    <button class="lg round sm" id="btnMenu" title="Camera options">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6" cy="12" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="12" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>

  <!-- ── right rail: exposure + zoom ─────────────────── -->
  <div class="rail-r">
    <div class="zoom lg" id="zoom">
      <button class="zoom-btn on" data-zoom="1">1×</button>
      <button class="zoom-btn" data-zoom="2">2×</button>
    </div>

    <div class="lens-rail lg" id="evRail">
      <span class="lens-cap">+2</span>
      <div class="lens-track" id="evTrack"><div class="lens-fill" id="evFill"></div></div>
      <span class="lens-thumb" id="evThumb"></span>
      <span class="lens-cap">−2</span>
      <span class="lens-val" id="evVal">0.0</span>
    </div>
  </div>

  <!-- ── bottom bar: gallery · shutter · recipe ──────── -->
  <div class="bottom">
    <button class="lg round" id="btnPhoto" title="Load a photo">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="4.5" width="18" height="15" rx="3.5"/><circle cx="9" cy="10" r="1.9"/>
        <path d="M3.5 17l4.5-3.6 3.6 2.7 3.9-3.9 5 4.8"/>
      </svg>
    </button>

    <button class="shutter" id="btnShoot" title="Shoot (space)"><i></i></button>

    <button class="recipe-btn lg" id="btnRecipe" aria-haspopup="dialog">
      <span class="rb-kicker">Recipe</span>
      <span class="rb-name" id="rbName">—</span>
      <svg class="rb-chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M6 15l6-6 6 6"/>
      </svg>
    </button>
  </div>

  <!-- ── countdown ───────────────────────────────────── -->
  <div class="countdown" id="countdown" hidden><span id="countText">3</span></div>
  <div class="flash" id="flash"></div>

  <!-- ── backdrop ────────────────────────────────────── -->
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- ── recipe picker ───────────────────────────────── -->
  <div class="sheet lg-sheet" id="sheetRecipe" hidden role="dialog" aria-label="Choose a recipe">
    <div class="grab"><span></span></div>
    <div class="sheet-head">
      <div>
        <div class="kicker">Recipes</div>
        <div class="title">Pick a look</div>
      </div>
      <button class="lg chip" id="btnEditCurrent">Tune</button>
    </div>
    <div class="sheet-body">
      <div class="rgrid" id="rgrid"></div>
      <p class="fineprint" id="recipeFine"></p>
    </div>
  </div>

  <!-- ── tune sheet ──────────────────────────────────── -->
  <div class="sheet lg-sheet" id="sheetTune" hidden role="dialog" aria-label="Tune recipe">
    <div class="grab"><span></span></div>
    <div class="sheet-head">
      <div>
        <div class="kicker">Tune</div>
        <div class="title" id="tuneTitle">—</div>
      </div>
      <button class="lg chip" data-close>Done</button>
    </div>
    <div class="sheet-body" id="tuneBody"></div>
  </div>

  <!-- ── camera options ──────────────────────────────── -->
  <div class="sheet lg-sheet" id="sheetMenu" hidden role="dialog" aria-label="Camera options">
    <div class="grab"><span></span></div>
    <div class="sheet-head">
      <div>
        <div class="kicker">Camera</div>
        <div class="title">Options</div>
      </div>
      <button class="lg chip" data-close>Done</button>
    </div>
    <div class="sheet-body" id="menuBody"></div>
  </div>

  <!-- ── info ────────────────────────────────────────── -->
  <div class="sheet lg-sheet" id="sheetInfo" hidden role="dialog" aria-label="About">
    <div class="grab"><span></span></div>
    <div class="sheet-head">
      <div>
        <div class="kicker">About</div>
        <div class="title">What this is</div>
      </div>
      <button class="lg chip" data-close>Done</button>
    </div>
    <div class="sheet-body" id="infoBody"></div>
  </div>

  <!-- ── review ──────────────────────────────────────── -->
  <div class="review" id="review" hidden>
    <canvas id="shot"></canvas>
    <div class="review-top">
      <button class="lg chip" id="btnDiscard">Discard</button>
      <span class="review-meta" id="shotMeta"></span>
    </div>
    <div class="review-bar">
      <button class="lg chip" id="btnOpenInfo">Info</button>
      <button class="btn primary" id="btnSave">Save image</button>
    </div>
  </div>

  <div class="toast lg" id="toast"></div>
  <input type="file" id="file" accept="image/*,.tif,.tiff,.dng,.raw" hidden />
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Liquid Glass: a soft lens bend used on the big glass surfaces -->
    <filter id="lg-bend" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b" />
      <feSpecularLighting in="b" surfaceScale="5" specularConstant="0.55" specularExponent="28"
                          lighting-color="#ffffff" result="s">
        <fePointLight x="-120" y="-160" z="240" />
      </feSpecularLighting>
      <feComposite in="s" in2="SourceGraphic" operator="in" result="s2" />
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0" />
    </filter>
  </defs>
</svg>

<script>
// A phone has no devtools. If anything throws before the UI is up, say so on
// screen instead of leaving a black rectangle. Installed before the engine so
// it also catches engine-level failures.
function __rcFatal(err) {
  try {
    var box = document.getElementById('fatal');
    if (!box) {
      box = document.createElement('div');
      box.id = 'fatal';
      box.style.cssText = 'position:fixed;inset:0;z-index:9999;padding:32px 22px;'
        + 'background:#0a0a0c;color:#ffb4b4;font:13px/1.5 ui-monospace,monospace;'
        + 'white-space:pre-wrap;overflow:auto';
      document.body.appendChild(box);
    }
    box.textContent = 'Recipe Cam failed to start\n\n'
      + (err && (err.stack || err.message) || String(err))
      + '\n\nDevice: ' + navigator.userAgent;
  } catch (e) { /* nothing left to do */ }
}
window.addEventListener('error', function (e) { __rcFatal(e.error || e.message); });
window.addEventListener('unhandledrejection', function (e) { __rcFatal(e.reason); });

</script>
</body>
</html>
