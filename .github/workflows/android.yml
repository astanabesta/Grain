name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── guard rails on the web bundle ────────────────────────────────────
      - name: Verify the web bundle is self-contained
        run: |
          test -s web/index.html || { echo "::error::web/index.html missing"; exit 1; }
          echo "web/index.html is $(stat -c%s web/index.html) bytes"
          if grep -qE '<script[^>]+src=|<link[^>]+href="http' web/index.html; then
            echo "::error::bundle references an external script or stylesheet"
            exit 1
          fi
          echo "no external <script src> or <link href> — OK"

      # The camera is the point of the app. If the bundle lost its camera path,
      # the build should fail rather than ship a photo filter.
      - name: Verify the camera path exists in the bundle
        run: |
          for needle in getUserMedia 'btnShoot' 'captureRegion'; do
            grep -q "$needle" web/index.html || { echo "::error::web bundle is missing '$needle'"; exit 1; }
          done
          echo "camera path present"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-shell/package-lock.json

      - name: Install shell dependencies
        working-directory: app-shell
        run: npm ci

      - name: Generate Android project
        working-directory: app-shell
        run: npx cap add android

      - name: Sync web assets
        working-directory: app-shell
        run: npx cap sync android

      # ── the permissions a camera app cannot work without ─────────────────
      # Capacitor's BridgeWebChromeClient maps VIDEO_CAPTURE to
      # android.permission.CAMERA and asks Android at runtime — but a package
      # that does not DECLARE the permission is refused before any dialog is
      # drawn, and getUserMedia reports NotAllowedError exactly as if the user
      # had declined. Declaring it here is what makes the camera real.
      - name: Patch the Android manifest
        run: |
          M=app-shell/android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import sys
          path = sys.argv[1]
          xml = open(path).read()
          wanted = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
          ]
          missing = [w for w in wanted if w not in xml]
          if missing:
              xml = xml.replace('<application', '\n    '.join(missing) + '\n\n    <application', 1)
          open(path, 'w').write(xml)
          print('declared:', len(wanted))
          PY
          grep -E 'permission.CAMERA|hardware.camera' "$M"

      - name: Verify camera permission actually landed
        run: |
          M=app-shell/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$M" || { echo "::error::CAMERA not declared"; exit 1; }
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$M'); print('manifest is valid XML')"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: app-shell/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        working-directory: app-shell/android
        # Signed with a per-build key so the artifact is a real release APK.
        # This means every build has a DIFFERENT signature: installing one over
        # another needs an uninstall first. Put a real keystore in secrets for
        # anything you publish.
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci.keystore" \
            -alias recipecam -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-signing -keypass ci-signing \
            -dname "CN=Recipe Cam CI, OU=CI, O=Recipe Cam, L=NA, S=NA, C=NA"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ci.keystore" \
            -Pandroid.injected.signing.store.password=ci-signing \
            -Pandroid.injected.signing.key.alias=recipecam \
            -Pandroid.injected.signing.key.password=ci-signing

      - name: Collect + sanity-check the APKs
        run: |
          mkdir -p out
          find app-shell/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out
          # a zero-byte or absurdly small APK means the build silently failed
          for f in out/*.apk; do
            s=$(stat -c%s "$f")
            echo "$f = $s bytes"
            [ "$s" -gt 1000000 ] || { echo "::error::$f is implausibly small"; exit 1; }
            # the APK is a zip; check the magic
            head -c2 "$f" | grep -q 'PK' || { echo "::error::$f is not a zip"; exit 1; }
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: recipecam-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      - name: Publish the rolling download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built automatically from `${{ github.sha }}`.

            Download **app-release.apk** and install it. Android will warn about
            an unknown developer — expected for a sideloaded build.

            On first launch the app asks for camera permission. Allow it, or use
            "Load a photo" to shoot a recipe on an existing image.
          files: out/*.apk
          prerelease: true
          make_latest: false
