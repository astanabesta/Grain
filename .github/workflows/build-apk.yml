name: Build and Release Grain APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: grain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (CI only)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Keep personal debug signing stable across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: grain-personal-debug-key-v1-${{ github.repository_id }}
      - name: Restore personal debug signing key (optional)
        env:
          DEBUG_KEY: ${{ secrets.GRAIN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Unit tests, lint, and installable release APK
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleRelease 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          reports=list(Path('app/build').rglob('lint-results-debug.txt'))
          errors=[]
          if reports:
            lines=reports[0].read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if ': Error:' in line: errors.append('\n'.join(lines[i:i+8]))
          if not errors: errors=['\n'.join(Path('build.log').read_text(errors='replace').splitlines()[-55:])[-3500:]]
          for text in errors:
            text=text[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
            print('::error title=Android build issue::'+text)
          PY
          fi
          exit "$CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: grain-photo-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Grain GitHub Release with APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          mkdir -p release-files
          APK="release-files/Grain-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd release-files && sha256sum "Grain-$TAG.apk" > SHA256SUMS.txt)
          sed "s/vVERSION/$TAG/g" .github/release-notes.md > release-files/RELEASE_NOTES.md
          PUBLISHED=0
          : > release-files/publication.log
          for ATTEMPT in 1 2 3 4; do
            if gh release view "$TAG" > /dev/null 2>> release-files/publication.log; then
              break
            fi
            if gh release create "$TAG" --target "$GITHUB_SHA" --title "Grain $TAG — Device-test beta" \
                --notes-file release-files/RELEASE_NOTES.md --prerelease >> release-files/publication.log 2>&1; then
              break
            fi
            sleep "$((ATTEMPT * 6))"
          done
          for ATTEMPT in 1 2 3 4 5; do
            sleep "$((ATTEMPT * 4))"
            if gh release upload "$TAG" "$APK" release-files/SHA256SUMS.txt --clobber >> release-files/publication.log 2>&1; then
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "Grain-$TAG.apk"; then
                PUBLISHED=1
                break
              fi
            fi
          done
          cat release-files/publication.log
          if [ "$PUBLISHED" -ne 1 ]; then
            python3 - <<'PYERR'
          from pathlib import Path
          text=Path('release-files/publication.log').read_text(errors='replace')[-3000:]
          print('::error title=Release publication::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYERR
            exit 1
          fi
          printf '### Download the APK\n\n[Grain %s release](https://github.com/%s/releases/tag/%s)\n' "$TAG" "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grain-build-reports-${{ github.run_number }}
          path: |
            build.log
            release-files/publication.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
