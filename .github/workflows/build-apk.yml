name: Build and Release Grain APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: grain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (CI only)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Keep personal debug signing stable across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: grain-personal-debug-key-v1-${{ github.repository_id }}
      - name: Restore personal debug signing key (optional)
        env:
          DEBUG_KEY: ${{ secrets.GRAIN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Unit tests, lint, and installable debug APK
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(Path('build.log').read_text(errors='replace').splitlines()[-120:])[-18000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Android build output::'+text)
          PY
          fi
          exit "$CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: grain-photo-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Grain GitHub Release with APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          mkdir -p release-files
          APK="release-files/Grain-$TAG-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          (cd release-files && sha256sum "Grain-$TAG-debug.apk" > SHA256SUMS.txt)
          cat > release-files/RELEASE_NOTES.md <<'NOTES'
          ## Grain Photo — personal-device beta

          Install **Grain-v0.1.1-debug.apk** on your Redmi Note 13 Pro Plus.

          - Native Grain UI based on the final HTML design.
          - Camera2 JPEG still capture with experimental capture-time ISP recipes.
          - Zoom, framing, timer, private gallery, export and capture receipts.

          This is a **debug-signed device-test build**, not a production release. RAW and HEIF are not implemented. Camera response, orientation, preview matching and firmware support still require physical-device testing. Export important private photos before uninstalling.

          Build checks: Android unit tests, lint and APK assembly must pass before publication. Source/build reports are available in GitHub Actions. SHA256SUMS.txt verifies the APK download.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release-files/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" release-files/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Grain $TAG — Device-test beta" \
              --notes-file release-files/RELEASE_NOTES.md --prerelease
          fi
          printf '### Download the APK\n\n[Grain %s release](https://github.com/%s/releases/tag/%s)\n' "$TAG" "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grain-build-reports-${{ github.run_number }}
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
