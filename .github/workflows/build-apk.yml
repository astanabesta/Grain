name: Build and Release Grain (Android APK & iOS IPA)
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: grain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (CI only)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Signing key location
        run: echo "GRAIN_KEYSTORE=$HOME/grain-signing/grain.keystore" >> "$GITHUB_ENV"
      - name: Restore personal signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/grain-signing/grain.keystore
          key: grain-signing-v2-${{ github.repository_id }}
      - name: Use the secret key, or create the personal key once
        id: signing
        env:
          DEBUG_KEY: ${{ secrets.GRAIN_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GRAIN_KEYSTORE")"
          CREATED=false
          if [ -n "$DEBUG_KEY" ]; then
            printf '%s' "$DEBUG_KEY" | base64 --decode > "$GRAIN_KEYSTORE"
            echo "Signing with the GRAIN_DEBUG_KEYSTORE_BASE64 secret"
          elif [ -s "$GRAIN_KEYSTORE" ]; then
            echo "Signing with the cached personal key"
          else
            keytool -genkeypair -keystore "$GRAIN_KEYSTORE" -storetype PKCS12 -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Grain Photo personal build, O=Grain, C=BD"
            CREATED=true
            echo "::warning title=Signing::Created a new personal signing key. Installing this APK over an older build needs an uninstall first."
          fi
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          keytool -list -v -keystore "$GRAIN_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/^[[:space:]]*/Certificate /'
      - name: Keep the new personal key (main only)
        if: steps.signing.outputs.created == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/cache/save@v4
        with:
          path: ~/grain-signing/grain.keystore
          key: grain-signing-v2-${{ github.repository_id }}
      - name: Unit tests, lint, and installable release APK
        shell: bash
        env:
          GRAIN_SCREENS: ${{ startsWith(github.ref, 'refs/heads/dev/') && '1' || '0' }}
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleRelease 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          reports=list(Path('app/build').rglob('lint-results-debug.txt'))
          errors=[]
          if reports:
            lines=reports[0].read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if ': Error:' in line: errors.append('\n'.join(lines[i:i+8]))
          if not errors: errors=['\n'.join(Path('build.log').read_text(errors='replace').splitlines()[-55:])[-3500:]]
          for text in errors:
            text=text[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
            print('::error title=Android build issue::'+text)
          PY
          fi
          exit "$CODE"
      - name: Upload camera-back screenshots (dev branches)
        if: always() && startsWith(github.ref, 'refs/heads/dev/')
        uses: actions/upload-artifact@v4
        with:
          name: grain-screens-${{ github.run_number }}
          path: app/build/screens/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: grain-android-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grain-build-reports-${{ github.run_number }}
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Type-check the iOS sources
        shell: bash
        run: |
          set +e
          python3 tools/ios-typecheck.py
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=iOS type-check failed::swiftc could not resolve a name in the iOS sources"
          fi
          exit "$CODE"
      - name: Install XcodeGen if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate Xcode project and build unsigned iOS .ipa
        shell: bash
        run: |
          set +e
          set -o pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          VCODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          cd ios
          xcodegen generate
          xcodebuild -project GrainPhoto.xcodeproj \
            -scheme GrainPhoto \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VCODE" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('ios-build.log').read_text(errors='replace').splitlines()
          errs = [l for l in lines if ': error:' in l or 'error:' in l.lower()][-25:]
          msg = '\n'.join(errs if errs else lines[-50:])[-3500:]
          print('::error title=iOS Xcode build issue::' + msg.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            exit "$CODE"
          fi
          rm -rf Payload Grain-iOS.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GrainPhoto.app Payload/
          codesign --force --deep --sign - Payload/GrainPhoto.app
          zip -qry Grain-iOS.ipa Payload
          ls -lh Grain-iOS.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: grain-ios-ipa
          path: ios/Grain-iOS.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grain-ios-build-log-${{ github.run_number }}
          path: ios/ios-build.log
          if-no-files-found: ignore

  publish:
    needs: [android, ios]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: grain-android-apk
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: grain-ios-ipa
          path: artifacts/ios
      - name: Publish GitHub Release with Android APK & iOS IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          mkdir -p release-files
          APK="release-files/Grain-$TAG.apk"
          IPA="release-files/Grain-iOS-$TAG.ipa"
          cp artifacts/android/app-release.apk "$APK"
          cp artifacts/ios/Grain-iOS.ipa "$IPA"
          (cd release-files && sha256sum "Grain-$TAG.apk" "Grain-iOS-$TAG.ipa" > SHA256SUMS.txt)
          cat release-files/SHA256SUMS.txt
          sed "s/vVERSION/$TAG/g" .github/release-notes.md > release-files/RELEASE_NOTES.md

          PUBLISHED=0
          : > release-files/publication.log
          REL_TARGET=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.target_commitish' 2>/dev/null || true)
          if [ -n "$REL_TARGET" ] && [ "$REL_TARGET" != "$GITHUB_SHA" ]; then
            echo "Replacing $TAG (was $REL_TARGET)" >> release-files/publication.log
            gh release delete "$TAG" --cleanup-tag --yes >> release-files/publication.log 2>&1 || true
            sleep 5
          fi
          for ATTEMPT in 1 2 3 4; do
            if gh release view "$TAG" > /dev/null 2>> release-files/publication.log; then
              gh release edit "$TAG" --prerelease=false --latest --title "Grain $TAG" \
                  --notes-file release-files/RELEASE_NOTES.md >> release-files/publication.log 2>&1 || true
              break
            fi
            if gh release create "$TAG" --target "$GITHUB_SHA" --title "Grain $TAG" \
                --notes-file release-files/RELEASE_NOTES.md --latest >> release-files/publication.log 2>&1; then
              break
            fi
            sleep "$((ATTEMPT * 6))"
          done
          for ATTEMPT in 1 2 3 4 5; do
            sleep "$((ATTEMPT * 4))"
            if gh release upload "$TAG" "$APK" "$IPA" release-files/SHA256SUMS.txt --clobber >> release-files/publication.log 2>&1; then
              NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
              if echo "$NAMES" | grep -qx "Grain-$TAG.apk" && echo "$NAMES" | grep -qx "Grain-iOS-$TAG.ipa"; then
                PUBLISHED=1
                break
              fi
            fi
          done
          cat release-files/publication.log
          if [ "$PUBLISHED" -ne 1 ]; then
            exit 1
          fi
          printf '### Download Grain %s\n\n- [Android APK & iOS IPA Release](https://github.com/%s/releases/tag/%s)\n' "$TAG" "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
